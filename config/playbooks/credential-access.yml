id: credential-access
title: Credential theft
applies_to: [Credential Access]
steps:
  - phase: containment
    action: Isolate the host where the credential access happened.
  - phase: containment
    action: Treat every account that was logged on to that host as exposed, and reset its credentials.
    d3fend: D3-CH
    evidence_hint: The user entities on this incident, plus accounts with sessions on the host.
  - phase: eradication
    action: For Kerberos ticket abuse, reset the affected service account passwords, and the KRBTGT account twice if a domain-wide compromise is possible.
  - phase: eradication
    action: Find the tool or access that allowed the theft and remove it.
  - phase: recovery
    action: Rebuild the host if its integrity cannot be shown, then return it to service.
  - phase: lessons_learned
    action: Record which accounts were exposed and how long the credentials were valid.
