{% extends "base.html" %}
{% block title %}Alert {{ uid }} - ThreatLens{% endblock %}
{% block body %}
<p><a href="/">&larr; All incidents</a></p>
<h1>Alert {{ uid }}</h1>
<p>{{ alert.rule }} <span class="badge">{{ alert.severity }}</span> <time datetime="{{ alert.time }}">{{ alert.time }}</time> {{ alert.environment }}</p>
<h2>Finding as received</h2>
<pre>{{ raw }}</pre>
{% endblock %}
