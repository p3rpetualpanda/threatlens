<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ThreatLens{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header><a href="/">ThreatLens</a>{% if user and user.role in ("lead", "admin") %}<a href="/audit">Audit log</a>{% endif %}{% if user and user.role == "admin" %}<a href="/admin/keys">API keys</a><a href="/admin/users">Users</a>{% endif %}{% if user %}<span class="muted">{{ user.email }} ({{ user.role }})</span><form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button type="submit">Sign out</button></form>{% endif %}</header>
<main id="main">
{% block body %}{% endblock %}
</main>
</body>
</html>
