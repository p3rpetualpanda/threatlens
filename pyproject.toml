[project]
name = "threatlens"
version = "0.1.0"
description = "Explainable blue-team threat detection and incident response: findings become prioritised, explained alerts with an analyst workflow."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.0,<1",
    "jinja2>=3.1.6",
    "jsonschema>=4.23",
    "pyyaml>=6",
    "uvicorn>=0.54.0,<1",
]

[project.scripts]
threatlens = "app.cli:main"

[dependency-groups]
dev = [
    "bandit>=1.8",
    "httpx>=0.27",
    "hypothesis>=6",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.17.2",
    "types-pyyaml>=6",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "scripts"]
mypy_path = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.report]
fail_under = 80

[tool.bandit]
exclude_dirs = ["tests"]
