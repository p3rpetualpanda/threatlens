name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # bash on Windows too, so a failing first command in a step fails the step.
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Security scan (bandit)
        run: uv run bandit -c pyproject.toml -r app -q

      - name: Dependency audit (pip-audit)
        run: uv run pip-audit --skip-editable

      - name: Tests
        run: uv run pytest

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the demo image
        run: docker build -t threatlens-demo .
      - name: Start it and check /health
        run: |
          docker run -d --name demo -p 8000:8000 threatlens-demo
          for _ in $(seq 30); do curl -fs http://127.0.0.1:8000/health && exit 0; sleep 2; done
          docker logs demo
          exit 1
